<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitação de Concretagem</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            width: 350px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        h1 {
            font-size: 20px;
            text-align: center;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #2d3436;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <div class="card">
        <img src="./images/logo_original.png" alt="logo concrelagos" style="width: stretch;">
        <h1>Solicitar Concretagem</h1>

        <input type="text" id="nome" placeholder="Nome completo">
        <input type="text" id="cpf" placeholder="CPF">
        <input type="text" id="endereco" placeholder="Endereço da obra">
        <label style="font-size: 13px; color: #555; display: block; margin-bottom: 5px;">
            Data de concretagem
        </label>

        <input type="date" id="data">

        <button onclick="enviar()">Solicitar</button>
    </div>

    <script>
        function enviar() {
            let nome = document.getElementById("nome").value;
            let cpf = document.getElementById("cpf").value;
            let endereco = document.getElementById("endereco").value;
            let data = document.getElementById("data").value;

            if (!nome || !cpf || !endereco || !data) {
                alert("Preencha todos os campos");
                return;
            }

            // salva os dados
            localStorage.setItem("nome", nome);
            localStorage.setItem("cpf", cpf);
            localStorage.setItem("endereco", endereco);
            localStorage.setItem("data", data);

            // redireciona
            window.location.href = "obrigado.html";
        }
    </script>

</body>

</html>
