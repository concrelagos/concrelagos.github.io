<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Validação de Acesso</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f6fa;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.card {
    background: #fff;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    text-align: center;
    width: 320px;
}

h1 {
    font-size: 20px;
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border-radius: 8px;
    border: 1px solid #ccc;
    margin-bottom: 15px;
    outline: none;
}

button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(90deg, #0cdcc7, #07a796);
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

.text {
    font-size: 12px;
    color: #666;
    margin-top: 15px;
}
</style>
</head>

<body>

<div class="card">

    <div>
        <img src="./images/logo_original.png" alt="logo concrelagos">
    </div>
    <h1>Validação de Acesso</h1>

    <input type="text" id="cpf" placeholder="Digite seu CPF" maxlength="14">
    
    <button onclick="validar()">Continuar</button>

    <div class="text">
        Seus dados estão protegidos 🔒
    </div>
</div>

<script>
// máscara de CPF
document.getElementById("cpf").addEventListener("input", function(e) {
    let v = e.target.value.replace(/\D/g, "");
    v = v.replace(/(\d{3})(\d)/, "$1.$2");
    v = v.replace(/(\d{3})(\d)/, "$1.$2");
    v = v.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
    e.target.value = v;
});

function validar() {
    let cpf = document.getElementById("cpf").value;

    if (cpf.length < 14) {
        alert("Digite um CPF válido");
        return;
    }

    // salva CPF (opcional)
    localStorage.setItem("cpf", cpf);

    // redireciona
    window.location.href = "status.html";
}
</script>

</body>
</html>
